# Trimmed 2026-07-31 -- this file now configures exactly one system: a
# 12-month-momentum long/flat signal with a rare-firing crisis circuit
# breaker (analysis/signals.py, analysis/crisis.py, analysis/universe.py,
# analysis/backtest.py). See CLAUDE.md's "V2 architecture" and
# "V1 removal" sections for the history behind this shape.
