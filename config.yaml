data:
  # How many calendar days of history to fetch on initial load
  history_days: 365
  # Seconds to wait between yfinance requests to avoid throttling
  rate_limit_seconds: 2.5
  # Retry attempts on failed fetch
  max_retries: 5

database:
  path: "database/investment_research.db"

scheduler:
  timezone: "UTC"
  # Three daily runs on weekdays (Mon–Fri):
  #   07:00 UTC  Pre-market  — analysis only (Asian session closed, European markets opening)
  #   13:30 UTC  US open     — analysis only (catches overnight moves before US open)
  #   21:30 UTC  End of day  — full data refresh + analysis (primary run, after NYSE close)
  runs:
    pre_market:
      hour: 7
      minute: 0
      label: "Pre-Market"
      type: "analysis_only"
    us_open:
      hour: 13
      minute: 30
      label: "US Open"
      type: "analysis_only"
    eod:
      hour: 21
      minute: 30
      label: "End of Day"
      type: "full"

accounts:
  - id: t212_practice
    name: "Trading212 Practice"
    type: PRACTICE
    platform: Trading212
    default: true
  - id: t212_live
    name: "Trading212 Live"
    type: LIVE
    platform: Trading212
    default: false

macro:
  # Get a free FRED API key at https://fred.stlouisfed.org/docs/api/api_key.html
  # Set via FRED_API_KEY env var (preferred) or leave blank to skip yield-curve scoring.
  fred_api_key: ""

  # FRED series pulled on each EOD scheduler run and stored in macro_indicators table.
  # Each entry: label (display name), category (groups the UI), and optional thresholds.
  # Remove or comment-out a series to stop pulling it; add a new series_id key to include it.
  fred_series:
    DFII10:
      label: "10Y Real Yield (TIPS)"
      category: "real_yields"
    T10YIE:
      label: "10Y Breakeven Inflation"
      category: "real_yields"
    BAMLH0A0HYM2:
      label: "High Yield OAS"
      category: "credit_spreads"
      # Values in % (1.0 = 100 bps). Stress flags fire if current value exceeds threshold
      # or rises more than the jump threshold within 30 days.
      stress_threshold_pct: 5.0    # 500 bps
      stress_30d_jump_pct:  1.0    # 100 bps
    BAMLC0A0CM:
      label: "Investment Grade OAS"
      category: "credit_spreads"
    M2SL:
      label: "M2 Money Supply"
      category: "liquidity"
    DPCREDIT:
      label: "Fed Discount Window"
      category: "liquidity"
    T10Y2Y:
      label: "10Y-2Y Yield Spread"
      category: "yield_curve"
    T10Y3M:
      label: "10Y-3M Yield Spread"
      category: "yield_curve"
    # USALOLITONOSTSAM (OECD US Leading Indicator) was removed — FRED returns no
    # data for this series.  Replaced with USSLIND (Philadelphia Fed Leading Index).
    USSLIND:
      label: "US Leading Index (Philadelphia Fed)"
      category: "leading_indicators"
    PERMIT:
      label: "Housing Permits (Total)"
      category: "leading_indicators"
    DTWEXBGS:
      label: "Trade Weighted Dollar (Broad)"
      category: "dollar"
    BOGMBASE:
      label: "Monetary Base"
      category: "liquidity"

confluence:
  # Minimum number of signals that must agree for a BUY/SELL call
  min_signals_required: 3
  # Total number of signal modules (regime, trend, mean_reversion, volatility, volume, macro, correlation)
  total_signal_modules: 7
  # Score thresholds: score = agreeing_signals / total_signal_modules
  buy_threshold: 0.60
  sell_threshold: 0.60

signals:
  # Lookback periods (trading days) used across analysis modules
  short_window: 20
  medium_window: 50
  long_window: 200
  rsi_period: 14
  atr_period: 14
  bollinger_period: 20
  bollinger_std: 2.0
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  adx_period: 14
  adx_trend_threshold: 25
  volume_avg_period: 20

notifications:
  email:
    enabled: false
    smtp_host: "smtp-relay.brevo.com"
    smtp_port: 587
    smtp_user: "your-smtp-login@example.com"
    smtp_password: ""  # Set via SMTP_PASSWORD env var
    from_address: "hello@example.com"
    to_addresses:          # List of recipient addresses
      - "you@example.com"
    alert_cooldown_hours: 8  # Minimum hours between auto-sent alert emails

learning:
  enabled: true
  # Minimum closed trades required before weights are adjusted for the first time
  min_trades_before_adjustment: 20
  # Recalculate weights every N closed trades after the minimum is reached
  weight_update_frequency: 10
  # Clamp per-indicator weight to this range after learning adjustment
  max_single_weight: 0.30
  min_single_weight: 0.05
