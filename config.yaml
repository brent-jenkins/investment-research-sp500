watchlist:
  indices:
    - ticker: "^GSPC"
      name: "S&P 500"
      exchange: "NYSE"
    - ticker: "^IXIC"
      name: "NASDAQ Composite"
      exchange: "NYSE"
    - ticker: "^FTSE"
      name: "FTSE 100"
      exchange: "LSE"
    - ticker: "^GDAXI"
      name: "DAX"
      exchange: "XETR"

  sector_etfs:
    - ticker: "XLE"
      name: "Energy Select Sector"
      exchange: "NYSE"
    - ticker: "XLF"
      name: "Financial Select Sector"
      exchange: "NYSE"
    - ticker: "XLK"
      name: "Technology Select Sector"
      exchange: "NYSE"
    - ticker: "XLV"
      name: "Health Care Select Sector"
      exchange: "NYSE"
    - ticker: "XLI"
      name: "Industrial Select Sector"
      exchange: "NYSE"

  commodities:
    - ticker: "GLD"
      name: "SPDR Gold Shares"
      exchange: "NYSE"
    - ticker: "SLV"
      name: "iShares Silver Trust"
      exchange: "NYSE"
    - ticker: "USO"
      name: "United States Oil Fund"
      exchange: "NYSE"
    - ticker: "CORN"
      name: "Teucrium Corn Fund"
      exchange: "NYSE"

  bonds:
    - ticker: "TLT"
      name: "iShares 20+ Year Treasury Bond"
      exchange: "NYSE"
    - ticker: "IEF"
      name: "iShares 7-10 Year Treasury Bond"
      exchange: "NYSE"
    - ticker: "HYG"
      name: "iShares iBoxx High Yield Corporate Bond"
      exchange: "NYSE"

  volatility:
    - ticker: "^VIX"
      name: "CBOE Volatility Index"
      exchange: "NYSE"

data:
  # How many calendar days of history to fetch on initial load
  history_days: 365
  # Seconds to wait between yfinance requests to avoid throttling
  rate_limit_seconds: 1.5
  # Retry attempts on failed fetch
  max_retries: 3

database:
  path: "database/investment_research.db"

scheduler:
  # Cron expression for daily data pull — 21:30 UTC = after NYSE close (16:00 ET)
  hour: 21
  minute: 30
  timezone: "UTC"

macro:
  # Get a free FRED API key at https://fred.stlouisfed.org/docs/api/api_key.html
  # Leave blank to skip yield curve scoring (VIX scoring still works without it)
  fred_api_key: ""

confluence:
  # Minimum number of signals that must agree for a BUY/SELL call
  min_signals_required: 3
  # Total number of signal modules (regime, trend, mean_reversion, volatility, volume, macro)
  total_signal_modules: 6
  # Score thresholds: score = agreeing_signals / total_signal_modules
  buy_threshold: 0.60
  sell_threshold: 0.60

signals:
  # Lookback periods (trading days) used across analysis modules
  short_window: 20
  medium_window: 50
  long_window: 200
  rsi_period: 14
  atr_period: 14
  bollinger_period: 20
  bollinger_std: 2.0
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  adx_period: 14
  adx_trend_threshold: 25
  volume_avg_period: 20
