data:
  # How many calendar days of history to fetch on initial load for any asset
  # that has no existing data in the database.  7150 = ~19.6 years, reaching
  # back to 2007-01-01 (raised from 3650/~10y on 2026-07-30 alongside
  # data.ingestion:backfill_price_history() extending existing tickers'
  # history back to the same date -- see CLAUDE.md's "Historical data
  # extension" section); yfinance returns from the asset's listing date if
  # this precedes it, so newer ETFs are handled gracefully either way.
  history_days: 7150
  # Seconds to wait between yfinance requests to avoid throttling
  rate_limit_seconds: 2.5
  # Retry attempts on failed fetch
  max_retries: 5

database:
  path: "database/investment_research.db"

scheduler:
  timezone: "UTC"
  # One daily run on weekdays (Mon-Fri), plus the hourly trade-alert job and
  # the Monday-only stale-order cancellation (both registered directly in
  # data/scheduler.py:start_scheduler(), not driven by this `runs:` dict):
  #   21:30 UTC  End of day  — full data refresh + order logic (the only run that pulls prices)
  #
  # The 07:00 (Tue-Fri) pre-market and 13:30 US-open "analysis only" runs
  # that used to also live here were removed 2026-07-31 -- confirmed
  # genuinely redundant, not assumed: both ever did was call
  # maybe_exit_positions(), which the hourly trade_alert_check job already
  # calls at the exact same 07:00 minute and within 30-60 minutes of 13:30
  # either way. The pre-market job's own data pull (for exchanges that
  # "just closed") had separately become a permanent no-op, since the
  # current instruments: universe is exclusively NYSE/FX-listed -- see
  # CLAUDE.md's "Pre-market/US-open scheduled runs removed" section for
  # the full investigation.
  runs:
    eod:
      hour: 21
      minute: 30
      label: "End of Day"
      type: "full"

signals:
  # The only key read anywhere in the surviving momentum/crisis-override
  # system -- analysis/backtest.py:precompute_ticker() and
  # brokers/trading212.py both read this for ATR-based stop-loss sizing.
  atr_period: 14

notifications:
  email:
    enabled: true
    smtp_host: "smtp-relay.brevo.com"
    smtp_port: 587
    smtp_user: "your-smtp-login@example.com"
    smtp_password: ""  # Set via SMTP_PASSWORD env var
    from_address: "hello@example.com"
    to_addresses:          # List of recipient addresses
      - "you@example.com"
    alert_cooldown_hours: 8  # Minimum hours between auto-sent alert emails

backtest:
  # Notional account size VaR position sizing uses inside simulate_trades().
  # simulate_trades() runs one ticker at a time with no shared, compounding
  # cross-ticker portfolio balance, so this stays constant for every entry
  # across a whole run rather than growing/shrinking the way a real account
  # would.
  starting_capital_gbp: 50000
  atr_stop_multiplier: 2.0       # stop loss = entry +/- N x ATR (matches live system)
  # Fallback max holding days -- analysis/universe.py:get_max_holding_days()
  # uses this only for a ticker with no trading212_invest.instrument_mapping
  # entry (e.g. a ticker only ever exercised inside a backtest, not currently
  # live-traded).
  max_holding_days: 30

# Live execution config for the momentum + crisis-override system -- see
# CLAUDE.md's "V2 architecture -- phased rebuild" section for the full
# validation history behind this design (a single 12-month-momentum signal,
# long/flat, no regime classifier, plus a rare-firing single-day >=7% crisis
# circuit breaker).
trading212_invest:
  enabled: true
  live: false               # NEVER set true -- place_market_order() blocks it in code regardless
  # pause_new_entries was set true 2026-07-31 while a real pricing bug
  # (get_instrument_price_gbp() never getting a live T212 quote) and a
  # missing exception-isolation gap in the BUY loop were investigated and
  # fixed -- see CLAUDE.md's "Live pricing bug, exception isolation, and ETF
  # mapping audit" section. Both fixes deployed and verified live; new order
  # placement resumes as of this change (key removed rather than left as
  # `false`, since brokers/trading212.py's check is `if t212_cfg.get(...)`,
  # so an absent key already means "not paused" -- no reason to keep a dead
  # flag around).
  # max_total_deployed -- percentage of the account's CURRENT total value
  # (client.get_account_summary()["totalValue"], fetched fresh on every
  # decide/submit call -- a genuinely compounding balance, not a fixed
  # reference figure) that may be deployed at once. Read identically by
  # live order placement (brokers/trading212.py) and by the backtest
  # engine's own default, live-matching simulation
  # (analysis/backtest.py:simulate_portfolio_compounding(), invoked by
  # analysis/validation.py:run_full_validation() whenever no explicit
  # engine override is passed) -- one shared key, one shared meaning,
  # deliberately -- see CLAUDE.md's "Live execution switched to the
  # compounding two-parameter scheme" section for why this file previously
  # let live and backtest silently diverge on this exact question.
  max_total_deployed: 0.5
  # per_trade_pct -- the VaR sizing ceiling for a single new entry, as a
  # percentage of the account's CURRENT total value (same compounding
  # balance as max_total_deployed above) rather than a fixed GBP figure.
  # Replaces max_position_gbp for live order placement (2026-08-01) --
  # validated via a 20-combination sweep against real 2007-2026 production
  # data (per_trade_pct in {2,3,5,7,10}% x max_total_deployed in
  # {50,65,75,90}%); 5% is the sole combination that reproduces the
  # canonical 14/16-block failure pattern (see CLAUDE.md's "Compounding
  # portfolio backtest" section for the full sweep and the reservations
  # that come with this recommendation -- it is not an unqualified "beats
  # the market" result).
  per_trade_pct: 0.05
  # max_open_positions and max_position_gbp are RETIRED (2026-08-01) --
  # neither key exists in this file any more, and nothing reads them from
  # config. Position count is an emergent consequence of per_trade_pct and
  # max_total_deployed together, not a third, independently-enforced rule;
  # the per-trade ceiling is per_trade_pct above, not a fixed £ figure. The
  # two older backtest engines that used to read these keys
  # (analysis/backtest.py:simulate_trades() / simulate_portfolio(), still
  # explicitly selectable via run_full_validation(uncapped=True) /
  # run_full_validation(portfolio_mode=True) to reproduce the "Current
  # baseline" / "Portfolio-capped validation findings" figures already
  # published in CLAUDE.md) now have the historical £2,500 / 20-position
  # values frozen directly into their own code as fallback defaults, so
  # removing these keys here does not break that reproducibility -- see
  # CLAUDE.md's "Live execution switched to the compounding two-parameter
  # scheme" section for the full rationale.
  # Position sizing -- Historical VaR, scaled to each ticker's own holding
  # period via the square-root-of-time rule
  # (analysis/volatility.py:_var_position_size_core()) -- position size
  # scales inversely with a ticker's own volatility rather than giving every
  # ticker the same flat allocation.
  var_confidence: 0.95
  var_lookback_days: 252
  max_risk_pct: 0.01
  min_position_gbp: 50
  # Max holding days -- analysis/universe.py:get_max_holding_days() dispatches
  # on each ticker's own `instruments:` is_etf flag (top-level section,
  # below `watchlist:`): ETFs get the longer 90d backstop, individual
  # stocks get the tighter 30d backstop (higher idiosyncratic risk than a
  # diversified ETF). A ticker with no `instruments:` entry falls back to
  # backtest.max_holding_days.
  max_holding_days: 90
  stock_max_holding_days: 30
  # Exchange-aware order submission (2026-07-31) -- see CLAUDE.md's
  # "Exchange-aware order submission" section. EOD still computes signals
  # and queues entry decisions into pending_orders exactly as before; these
  # two flags gate the separate exchange-timed jobs that actually submit
  # them (submit_pending_etf_orders() at 07:00 UTC / LSE open,
  # submit_pending_stock_orders() at 13:30 UTC / NYSE open).
  #
  # ETF submission stays PAUSED (explicitly false) until this mechanism has
  # been deployed and verified live -- do not flip this to true as part of
  # deploying the mechanism itself; that is a separate, later decision.
  etf_submission_enabled: false
  # Stock submission continues as today (no change in behaviour requested
  # for stocks) -- defaults true even if this key were removed, but kept
  # explicit for symmetry with etf_submission_enabled above.
  stock_submission_enabled: true
  # Submission-time sanity check: if a ticker's price has moved more than
  # this fraction since the EOD decision was made, skip submission and log
  # clearly rather than execute on a stale decision (same "fail loud, don't
  # guess" principle as the 2026-07-31 pricing-bug fix). 3% is comfortably
  # above ordinary day-to-day noise for a diversified ETF or large-cap
  # stock, but well below a genuine earnings-surprise/macro-shock gap --
  # see CLAUDE.md for the full rationale.
  price_sanity_threshold_pct: 0.03
