# Trimmed 2026-07-31 -- this file now configures exactly one system: a
# 12-month-momentum long/flat signal with a rare-firing crisis circuit
# breaker (analysis/signals.py, analysis/crisis.py, analysis/universe.py,
# analysis/backtest.py). See CLAUDE.md's "V2 architecture" and
# "V1 removal" sections for the history behind this shape.
watchlist:
  # Trimmed 2026-07-31 to exactly what the momentum + crisis-override system
  # needs: its own 73-ticker universe (see `instruments:` below and
  # analysis/universe.py:ALL_TICKERS), ^GSPC (crisis-override reference
  # index), and GBPUSD=X/EURUSD=X (FX conversion for non-GBP positions).
  # core is monitoring-only and deliberately stays separate from
  # `instruments:` below -- none of these three ever has (or ever will have)
  # an execution mapping; see CLAUDE.md's "Unified instrument structure"
  # section. The six-module confluence system this watchlist used to serve
  # (112 assets across 21 groups) has been removed; nothing reads those
  # tickers anymore.
  core:
    - {ticker: "^GSPC", name: "S&P 500", exchange: "NYSE"}
    - {ticker: "GBPUSD=X", name: "GBP/USD", exchange: "FX"}
    - {ticker: "EURUSD=X", name: "EUR/USD", exchange: "FX"}

# One record per tradeable instrument -- consolidated 2026-07-31 from what
# used to be two separately-maintained structures (watchlist.trading's
# ticker/name/exchange, and trading212_invest.instrument_mapping's nested
# ticker/currency/is_etf) into a single source of truth per instrument. The
# duplication meant nothing structurally enforced the two staying in sync;
# XLF's and XLK's wrong T212 mappings were only ever found by accident,
# during an unrelated investigation, and could just as easily have been a
# ticker present in one structure but silently missing from the other. See
# CLAUDE.md's "Unified instrument structure" section for the full
# consolidation and tests/test_config.py for the structural validation that
# now makes an incomplete entry impossible to miss.
#
# The nested `ticker` field from the old instrument_mapping was renamed to
# `t212_instrument_id` -- the old name collided confusingly with the
# watchlist's own top-level `ticker` key (the research ticker), one meaning
