# Runs the full test suite on GitHub's own infrastructure — independent of
# whichever machine pushed, and not bypassable the way a local pre-push
# hook would be (`git push --no-verify`, a machine without the hook
# installed, or any git client that skips it would all still reach GitHub
# and, before this workflow existed, trigger a deploy regardless of test
# status via the native webhook alone). Only on genuine success does this
# workflow make its own signed call to the existing webhook listener --
# mimicking GitHub's own webhook payload/signature format exactly, so
# webhook_listener.py needed zero changes: it stays a thin "verify
# signature, then deploy" component, the test gate lives upstream of it
# here, not inside it.
#
# This repo's own local pre-push hook (which used to run this same test
# suite before every push) was removed entirely once this workflow made it
# redundant as a deploy gate -- see CLAUDE.md's "GitHub webhook deploy" for
# the reasoning. There is no local test-gating step left at all; this
# workflow is now the sole place the test suite is required to pass before
# a deploy happens.
#
# See CLAUDE.md's "GitHub webhook deploy" for the full design, including
# why the native webhook and this workflow briefly ran side by side during
# the staged rollout (the native webhook has since been removed entirely,
# once this workflow was proven working end to end), and deploy.sh's own
# concurrency guard (a lock, ${APP_DIR}/.deploy.lock.d) that made that
# overlap safe rather than merely convenient -- and which this workflow's
# deploy call still benefits from as the sole remaining trigger, in case a
# manual break-glass SSH deploy is ever run concurrently with it.
name: Test and Deploy

# Quoted ("on" rather than bare on:) -- unquoted `on:` is parsed as the
# boolean `true` by YAML 1.1 tooling (confirmed directly with PyYAML while
# writing this). GitHub's own Actions parser handles the bare form
# correctly regardless, but quoting it removes any ambiguity for any other
# tool that might read this file.
"on":
  push:
    branches: [main]
  # Lets a human re-run the pipeline against any branch/commit from the
  # Actions UI without needing a new commit (e.g. to re-verify after a
  # transient runner failure) -- the deploy step below is still gated to
  # main only, so a manual run against another branch can never deploy.
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest

      # Runs only if the test step above succeeded (the implicit default
      # for every step -- stated explicitly here anyway, deliberately, so
      # the gating intent can't be silently defeated by someone adding
      # `continue-on-error` to an earlier step without noticing the
      # implication) AND only for a genuine push to main (never for a
      # workflow_dispatch run against another branch/ref).
      - name: Trigger deploy
        if: success() && github.ref == 'refs/heads/main'
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          # Strip any trailing/leading whitespace or newline from the secret
          # before using it -- confirmed as a real, not hypothetical, need:
          # a 64-character secret was pasted into the GitHub Actions secret
          # field but read back as 65 characters (an incidental trailing
          # newline from copy-paste), producing a signature the listener
          # correctly rejected as invalid. Rather than rely on re-entering
          # the secret perfectly a second time, make this robust to the
          # artifact instead -- xargs collapses/trims all surrounding
          # whitespace reliably in a single portable command.
          WEBHOOK_SECRET="$(printf '%s' "$WEBHOOK_SECRET" | xargs)"
          # Minimal payload -- only the two fields webhook_listener.py's
          # should_trigger_deploy()/logging actually read (`ref`, `after`).
          # Signed exactly the way GitHub signs its own webhook deliveries
          # (HMAC-SHA256 over the raw body, `sha256=<hex>` header), computed
          # over the identical bytes curl sends below -- printf, not echo,
          # so no trailing newline sneaks into either the signed content or
          # the sent body.
          #
          # `ref` is the ACTUAL triggering ref (github.ref), not hardcoded
          # to main -- this step already only runs when github.ref really
          # is refs/heads/main (the `if:` above), so in normal operation
          # this changes nothing, but a hardcoded value would mean the
          # payload keeps lying "this was a push to main" even if that `if:`
          # condition were ever accidentally weakened later, silently
          # defeating the listener's own independent ref check instead of
          # the two layers providing genuine, independent defense-in-depth.
          PAYLOAD='{"ref":"'"${{ github.ref }}"'","after":"'"${{ github.sha }}"'"}'
          SIGNATURE="sha256=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')"
          response=$(curl -sS -o /tmp/webhook_response.txt -w '%{http_code}' \
            -X POST https://platform.example.com/webhook/deploy \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$PAYLOAD")
          echo "Listener responded: HTTP $response"
          cat /tmp/webhook_response.txt
          echo ""
          if [ "$response" != "202" ]; then
            echo "::error::Expected HTTP 202 (deploy triggered) from the webhook listener, got $response"
            exit 1
          fi
